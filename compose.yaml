services:
  workbench:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3939:3939"
    environment:
      WORKBENCH_PASSWORD: ${WORKBENCH_PASSWORD:?请在 .env 中设置 WORKBENCH_PASSWORD}
      WORKBENCH_USERNAME: ${WORKBENCH_USERNAME:?请在 .env 中设置 WORKBENCH_USERNAME}
      WORKBENCH_PUBLIC_URL: ${WORKBENCH_PUBLIC_URL:-}
      WORKBENCH_SECURE_COOKIE: ${WORKBENCH_SECURE_COOKIE:-true}
      WORKBENCH_LOCK_SETUP: "true"
      WORKBENCH_TRUST_PROXY: ${WORKBENCH_TRUST_PROXY:-false}
      EQUIPMENT_BASE_URL: ${EQUIPMENT_BASE_URL:-}
      DEVICE_LOGIN_HOST: ${DEVICE_LOGIN_HOST:-}
      NEWS_LOGIN_HOST: ${NEWS_LOGIN_HOST:-}
    volumes:
      - workbench_data:/app/data
volumes:
  workbench_data:
